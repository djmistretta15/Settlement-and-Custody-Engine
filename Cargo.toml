[workspace]
members = [
    "contracts/rust/finality",
    "contracts/rust/custody",
    "contracts/rust/identity",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Decentralized Settlement Engine Team"]

[workspace.dependencies]
solana-program = "1.17"
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
borsh = "0.10.3"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
sha3 = "0.10"
curve25519-dalek = "4.1"
ed25519-dalek = "2.1"
frost-ed25519 = "1.0"
frost-secp256k1 = "1.0"
ark-ec = "0.4"
ark-ff = "0.4"
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-serialize = "0.4"
bs58 = "0.5"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
