version: '3.8'

services:
  # ====================
  # REDIS (State & Caching)
  # ====================
  redis:
    image: redis:7-alpine
    container_name: settlement-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - settlement-network

  # ====================
  # POSTGRES (Audit Logs & Analytics)
  # ====================
  postgres:
    image: postgres:15-alpine
    container_name: settlement-postgres
    environment:
      POSTGRES_DB: settlement_engine
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - settlement-network

  # ====================
  # CUSTODY ENGINE SERVICE
  # ====================
  custody-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.custody
    container_name: settlement-custody-engine
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      VAULT_CONTRACT_ADDRESS: ${VAULT_CONTRACT_ADDRESS}
      RPC_URL: ${ETHEREUM_RPC_URL}
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - custody-logs:/app/logs
      - ./zk-circuits/build:/app/zk-circuits/build:ro
    networks:
      - settlement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ====================
  # FINALITY SYNC SERVICE
  # ====================
  finality-sync:
    build:
      context: .
      dockerfile: docker/Dockerfile.finality
    container_name: settlement-finality-sync
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL}
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      LOG_LEVEL: debug
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - finality-logs:/app/logs
      - ./zk-circuits/build:/app/zk-circuits/build:ro
    networks:
      - settlement-network
    restart: unless-stopped

  # ====================
  # REST API SERVICE
  # ====================
  api-rest:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: settlement-api-rest
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/settlement_engine
      SETTLEMENT_ENGINE_ADDRESS: ${SETTLEMENT_ENGINE_ADDRESS}
      LIGHT_CLIENT_ADDRESS: ${LIGHT_CLIENT_ADDRESS}
      VAULT_ADDRESS: ${VAULT_CONTRACT_ADDRESS}
      KYC_REGISTRY_ADDRESS: ${KYC_REGISTRY_ADDRESS}
      RPC_URL: ${ETHEREUM_RPC_URL}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      custody-engine:
        condition: service_healthy
    volumes:
      - api-logs:/app/logs
    networks:
      - settlement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ====================
  # GRAPHQL API SERVICE
  # ====================
  api-graphql:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: settlement-api-graphql
    environment:
      NODE_ENV: production
      PORT: 4000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/settlement_engine
      SETTLEMENT_ENGINE_ADDRESS: ${SETTLEMENT_ENGINE_ADDRESS}
      LIGHT_CLIENT_ADDRESS: ${LIGHT_CLIENT_ADDRESS}
      VAULT_ADDRESS: ${VAULT_CONTRACT_ADDRESS}
      KYC_REGISTRY_ADDRESS: ${KYC_REGISTRY_ADDRESS}
      RPC_URL: ${ETHEREUM_RPC_URL}
      LOG_LEVEL: info
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - graphql-logs:/app/logs
    networks:
      - settlement-network
    restart: unless-stopped

  # ====================
  # MONITORING - PROMETHEUS
  # ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: settlement-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - settlement-network
    restart: unless-stopped

  # ====================
  # MONITORING - GRAFANA
  # ====================
  grafana:
    image: grafana/grafana:latest
    container_name: settlement-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - settlement-network
    restart: unless-stopped

  # ====================
  # LOG AGGREGATION - LOKI
  # ====================
  loki:
    image: grafana/loki:latest
    container_name: settlement-loki
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - settlement-network
    restart: unless-stopped

  # ====================
  # NGINX REVERSE PROXY
  # ====================
  nginx:
    image: nginx:alpine
    container_name: settlement-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-rest
      - api-graphql
    networks:
      - settlement-network
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  custody-logs:
  finality-logs:
  api-logs:
  graphql-logs:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  settlement-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/16
