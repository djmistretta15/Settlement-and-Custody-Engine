apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: settlement-ingress
  namespace: settlement
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
spec:
  tls:
  - hosts:
    - api.settlement-engine.com
    - custody.settlement-engine.com
    secretName: settlement-tls
  rules:
  - host: api.settlement-engine.com
    http:
      paths:
      - path: /custody
        pathType: Prefix
        backend:
          service:
            name: custody-engine-internal
            port:
              number: 3001
      - path: /finality
        pathType: Prefix
        backend:
          service:
            name: finality-sync-internal
            port:
              number: 3002
      - path: /settlement
        pathType: Prefix
        backend:
          service:
            name: settlement-api-internal
            port:
              number: 3000
  - host: custody.settlement-engine.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: custody-engine-internal
            port:
              number: 3001
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: settlement-tls
  namespace: settlement
spec:
  secretName: settlement-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - api.settlement-engine.com
  - custody.settlement-engine.com
  - "*.settlement-engine.com"
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ingress-controller
  namespace: settlement
  labels:
    app: nginx-ingress
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERTIFICATE_ID"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "https"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: LoadBalancer
  selector:
    app: nginx-ingress
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
