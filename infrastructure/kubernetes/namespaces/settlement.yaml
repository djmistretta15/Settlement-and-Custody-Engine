apiVersion: v1
kind: Namespace
metadata:
  name: settlement
  labels:
    name: settlement
    environment: production
    managed-by: terraform
    compliance: soc2-pci-dss
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: settlement-quota
  namespace: settlement
spec:
  hard:
    requests.cpu: "100"
    requests.memory: 200Gi
    persistentvolumeclaims: "10"
    services.loadbalancers: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: settlement-limits
  namespace: settlement
spec:
  limits:
  - max:
      cpu: "4"
      memory: 8Gi
    min:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: "1"
      memory: 1Gi
    defaultRequest:
      cpu: 500m
      memory: 512Mi
    type: Container
