# Prometheus Configuration for Kong API Gateway
# Settlement and Custody Engine Monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    monitor: 'settlement-engine-monitor'
    environment: 'production'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

# Rule files
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # Kong Gateway Metrics
  - job_name: 'kong'
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - kong:8001
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):.*'
        replacement: '${1}'

  # Kong Analytics Service
  - job_name: 'kong-analytics'
    scrape_interval: 30s
    metrics_path: /prometheus
    static_configs:
      - targets:
          - analytics:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):.*'
        replacement: '${1}'

  # Settlement Engine Services
  - job_name: 'settlement-engine'
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - settlement-engine:3000
          - custody-engine:3001
          - finality-verifier:3002
          - kyc-service:3003

  # Node Exporter (System Metrics)
  - job_name: 'node'
    scrape_interval: 30s
    static_configs:
      - targets:
          - node-exporter:9100

  # Redis Metrics
  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets:
          - redis-exporter:9121

  # PostgreSQL Metrics (if used for Kong DB mode)
  - job_name: 'postgres'
    scrape_interval: 30s
    static_configs:
      - targets:
          - postgres-exporter:9187

  # Kubernetes Service Discovery (Optional)
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
